[workspace]
resolver = "3"
members = ["twin-ingest", "twin-predict", "twin-impact", "twin-api"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
wit-bindgen = { version = "0.61", default-features = false, features = ["async", "async-spawn", "inter-task-wakeup", "macros"] }
wasip3 = { version = "0.8", features = ["http-compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
http-body-util = "0.1"
bytes = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
