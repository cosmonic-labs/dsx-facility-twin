[package]
name = "twin-sim"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "DSX facility simulator: physics, DSX BMS telemetry, failure scenarios and a scenario API"

[[bin]]
name = "twin-sim"
path = "src/main.rs"

[dependencies]
twin-model = { path = "../crates/twin-model", features = ["profile"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
axum = "0.8"
async-nats = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.9", features = ["small_rng"] }
anyhow = "1"
tower-http = { version = "0.6", features = ["cors"] }
